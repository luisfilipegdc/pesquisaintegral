<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback Semi-Integral · 2º Semestre 2026</title>
<meta name="description" content="Apresentação interativa: o que a turma do 4º e 5º ano do Semi-Integral achou do 2º semestre de 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="bg-shapes" aria-hidden="true">
  <span class="shape s1">☁️</span><span class="shape s2">⭐</span><span class="shape s3">🎈</span>
  <span class="shape s4">☁️</span><span class="shape s5">✏️</span><span class="shape s6">🌈</span>
</div>

<main id="deck" aria-live="polite"></main>

<div class="progress" aria-hidden="true"><div id="bar"></div></div>
<nav class="controls" aria-label="Navegação da apresentação">
  <button id="prev" class="ctrl" aria-label="Slide anterior">◀</button>
  <span id="counter" class="counter">1 / 1</span>
  <button id="next" class="ctrl" aria-label="Próximo slide">▶</button>
  <button id="fs" class="ctrl small" aria-label="Tela cheia" title="Tela cheia (F)">⛶</button>
</nav>
<p class="hint" id="hint">Use ← → , espaço, clique ou deslize para navegar</p>

<script src="script.js"></script>
</body>
</html>
